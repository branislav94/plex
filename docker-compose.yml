# Plex na Dokploy VM-u (192.168.0.25)
# Putanje unutar kontejnera (/config, /smb_share, /transcode) su iste kao na starom TrueNAS setupu.
services:
  plex:
    container_name: plex
    image: lscr.io/linuxserver/plex:latest
    network_mode: host # lokalno otkrivanje servera (TV, telefon); port 32400
    environment:
      - PUID=0
      - PGID=0
      - VERSION=docker
      - TZ=Europe/Belgrade
    volumes:
      - /opt/plex/config:/config               # lokalni disk VM-a (SQLite ne ide na NFS)
      - /mnt/storage/plex:/smb_share           # NFS sa TrueNAS-a (192.168.0.101)
      - /opt/plex/transcode:/transcode         # lokalni disk
    restart: unless-stopped
